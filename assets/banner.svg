<svg width="100%" height="180" viewBox="0 0 960 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#0a101f" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D26A" />
      <stop offset="50%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#7000FF" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D26A" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#00F0FF" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#7000FF" stop-opacity="0" />
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1f293d" stroke-width="0.7" stroke-opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="960" height="180" rx="12" fill="url(#bgGrad)" />
  <rect width="960" height="180" rx="12" fill="url(#grid)" />

  <!-- Abstract Cybernetic Nodes & Constellation -->
  <g opacity="0.35">
    <circle cx="820" cy="50" r="3" fill="#00D26A" />
    <circle cx="890" cy="80" r="2" fill="#00F0FF" />
    <circle cx="780" cy="120" r="4" fill="#7000FF" />
    <circle cx="710" cy="60" r="2.5" fill="#00D26A" />
    <circle cx="850" cy="140" r="3" fill="#00F0FF" />
    <line x1="820" y1="50" x2="890" y2="80" stroke="#00D26A" stroke-width="0.8" />
    <line x1="820" y1="50" x2="710" y2="60" stroke="#00D26A" stroke-width="0.8" />
    <line x1="820" y1="50" x2="780" y2="120" stroke="#00F0FF" stroke-width="0.8" />
    <line x1="780" y1="120" x2="850" y2="140" stroke="#7000FF" stroke-width="0.8" />
    <line x1="890" y1="80" x2="850" y2="140" stroke="#00F0FF" stroke-width="0.8" />
  </g>

  <!-- Outer Neon Border -->
  <rect x="1" y="1" width="958" height="178" rx="11" fill="none" stroke="#22324f" stroke-width="1.5" />
  <line x1="40" y1="179" x2="400" y2="179" stroke="url(#lineGrad)" stroke-width="2" />

  <!-- Header Badge -->
  <rect x="40" y="28" width="160" height="22" rx="4" fill="#0e231e" stroke="#00D26A" stroke-width="0.8" />
  <text x="50" y="43" fill="#00D26A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.5">AUTONOMOUS SYSTEMS</text>

  <!-- Main Title -->
  <text x="40" y="94" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">ROMAN POKUSHKO</text>

  <!-- Subtitle with Gradient -->
  <text x="40" y="126" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" letter-spacing="0.5">Multi-Agent Swarm Architect &amp; 24/7 Resilience Harness Engineering</text>

  <!-- Subtext Indicators -->
  <text x="40" y="152" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5">VAK 2.3.1 Systems Analysis • Pearl's Causal Do-Calculus • Industrial Digital Twins</text>
</svg>
